# Arranque local:  docker compose up -d --build
# App:             http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vapers
      POSTGRES_PASSWORD: vapers
      POSTGRES_DB: vapers
    ports:
      # 5433 en tu PC para no chocar con otro Postgres que tengas instalado.
      # Solo accesible desde este PC (127.0.0.1): nadie de la red puede entrar a la base de datos.
      - "127.0.0.1:5433:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapers -d vapers"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vapers:vapers@db:5432/vapers
      APP_PASSWORD: ${APP_PASSWORD:?Falta APP_PASSWORD en el archivo .env}
      AUTH_SECRET: ${AUTH_SECRET:?Falta AUTH_SECRET en el archivo .env}
      APP_TZ: Europe/Madrid
    ports:
      - "3000:3000"

volumes:
  datos_postgres:
